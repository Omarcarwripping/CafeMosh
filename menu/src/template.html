<title>Café mosh Menü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Speisekarte Café mosh: Coffee, Drinks, Classics, Delights und Herbst & Winter Specials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500&display=swap">
<style>
/* Layout: printed card, re-flowed for a phone. Cream paper, cocoa ink, one heavy ME/NU block per tab,
   sticky tab bar, two columns of sections on wide screens. */
:root{
  --paper:#EDDFC6; --paper-2:#E5D3B4; --ink:#72502A; --ink-soft:#8A6A45;
  --clay:#CE9169; --matcha:#1F7A32; --on-ink:#EDDFC6;
  --f-mega:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-disp:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Poppins","Segoe UI",system-ui,sans-serif;
  --barh:52px; --top:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#2B1F13; --paper-2:#382817; --ink:#EDDFC6; --ink-soft:#C9B597;
  --clay:#DDA07A; --matcha:#86C98F; --on-ink:#2B1F13; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#2B1F13; --paper-2:#382817; --ink:#EDDFC6; --ink-soft:#C9B597;
  --clay:#DDA07A; --matcha:#86C98F; --on-ink:#2B1F13; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--clay);outline-offset:3px;border-radius:6px}

/* brand */
.hero{padding-block:34px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{position:relative;width:min(300px,72vw);aspect-ratio:1/.53;display:block}
.logo i{position:absolute;display:block;-webkit-mask:var(--m) no-repeat center/contain;mask:var(--m) no-repeat center/contain}
.l-cafe{--m:url({{cafe}});background:var(--clay);left:24%;top:0;width:38%;aspect-ratio:360/229;animation:write 1.1s var(--ease) both .15s}
.l-mosh{--m:url({{mosh}});background:var(--ink);left:0;bottom:0;width:93%;aspect-ratio:800/252;animation:rise .7s var(--ease) both}
.l-dot{left:95%;bottom:1.5%;width:4.6%;aspect-ratio:1;border-radius:50%;background:var(--clay);animation:pop .5s var(--ease) both .7s}
.tag{font:600 15px var(--f-disp);letter-spacing:-.01em;color:var(--clay);margin:0}
.tag b{color:var(--ink);font-weight:600}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* sticky bar */
.bar{position:sticky;top:var(--top);z-index:20;background:var(--paper);border-bottom:2.5px solid var(--ink)}
.bar-in{display:flex;align-items:center;gap:8px;height:var(--barh)}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);scrollbar-width:none;flex:1;min-width:0;height:100%;align-items:center;scroll-behavior:smooth}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:none;text-decoration:none;font:700 15px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;
  padding:10px 13px;border-radius:999px;color:var(--ink);transition:color .25s var(--ease);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--on-ink)}
.pill{position:absolute;z-index:0;left:0;top:50%;height:34px;margin-top:-17px;border-radius:999px;background:var(--ink);
  transition:transform .38s var(--ease),width .38s var(--ease);will-change:transform}
.leaf{width:8px;height:8px;border-radius:50% 0;background:var(--clay);transform:rotate(45deg)}
.find{flex:none;position:relative;display:flex;align-items:center}
.find input{width:40px;height:38px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);
  font:500 15px var(--f-body);padding:0 0 0 36px;transition:width .35s var(--ease),background .2s;cursor:pointer}
.find input:focus,.find input:not(:placeholder-shown){width:min(220px,48vw);cursor:text;background:var(--paper-2);outline:none;padding-right:12px}
.find input::placeholder{color:transparent}
.find input:focus::placeholder{color:var(--ink-soft)}
.find svg{position:absolute;left:11px;width:18px;height:18px;pointer-events:none}
.bar.searching .tabs{display:none}
.bar.searching .find{flex:1}
.bar.searching .find input{width:100%}

/* panel head */
.panel{padding-bottom:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:26px 10px}
.mega{margin:0;font:400 clamp(84px,27vw,150px)/.8 var(--f-mega);letter-spacing:-.045em;display:grid;color:var(--ink)}
.mega span{display:block}
.mega em{font:700 clamp(17px,5vw,24px)/1 var(--f-disp);font-style:normal;text-transform:uppercase;letter-spacing:.02em;
  padding:.28em 0 .32em .9em;color:var(--ink);text-wrap:balance}
.art{display:block;flex:none;background:var(--ink);-webkit-mask:var(--m) no-repeat center/contain;mask:var(--m) no-repeat center/contain;
  animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 90%}
.m-pumpkin{--m:url({{pumpkin}});width:min(30vw,150px);aspect-ratio:300/259}
.m-cinnamon{--m:url({{cinnamon}});width:min(26vw,130px);aspect-ratio:200/144}
.m-martini{--m:url({{martini}});width:min(20vw,105px);aspect-ratio:220/461}
.m-burger{--m:url({{burger}});width:min(36vw,200px);aspect-ratio:380/248;animation:none}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.badge{position:relative;flex:none;width:min(32vw,132px);aspect-ratio:1;display:grid;place-items:center;color:var(--paper)}
.badge svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 22s linear infinite}
.b-bg{fill:var(--clay)}
.b-ring{fill:var(--paper);font:500 10.5px var(--f-body);letter-spacing:.06em}
.badge span{position:relative;font:700 clamp(12px,3.3vw,14px)/1.05 var(--f-disp);text-transform:uppercase;text-align:center;color:var(--ink);transform:rotate(-14deg)}
.badge b{display:block;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* chips */
.chips{position:sticky;top:calc(var(--top) + var(--barh) + 2.5px);z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  background:var(--paper);padding-block:10px;margin-inline:-4px;padding-inline:4px;scroll-behavior:smooth;
  mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 22px),transparent)}
.chip{flex:none;text-decoration:none;font:600 13px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-radius:999px;
  border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);transition:background .25s,color .25s,border-color .25s}
.chip.on{background:var(--clay);border-color:var(--clay);color:#fff}
.bar.searching ~ main .chips,.bar.searching ~ main .ph,.bar.searching ~ main .promo{display:none}

/* sections */
.cols{columns:1;column-gap:44px}
@media (min-width:760px){.cols{columns:2}}
.sec{break-inside:avoid;padding-top:18px;scroll-margin-top:calc(var(--top) + var(--barh) + 12px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;padding-bottom:6px;border-bottom:3px solid currentColor;
  font:700 clamp(25px,7vw,30px)/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sec-p{font-size:.72em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-note{margin:8px 0 0;font:500 13px var(--f-disp)}
.sec-foot{margin:10px 0 0;font:600 12.5px var(--f-disp);opacity:.85}
.matcha{color:var(--matcha)}
.items{list-style:none;margin:0;padding:6px 0 0 8px;display:grid}
.it{padding-block:7px}
.it-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.it-n{font:700 16px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.035em;min-width:0}
.it-p{font:700 15.5px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.it-d{margin:3px 0 0;font-size:13px;color:var(--ink-soft);max-width:44ch}
.matcha .it-d{color:inherit}

/* promo */
.promo{background:var(--ink);color:var(--paper);border-radius:4px;padding:22px 20px;margin-top:16px;display:grid;gap:4px}
.promo p,.promo ul{margin:0}
.promo-a{font:400 clamp(34px,10vw,46px)/1 var(--f-mega);letter-spacing:-.03em}
.promo-b{font:700 17px var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
.promo-c{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font:700 17px var(--f-disp);text-transform:uppercase;color:var(--clay);margin-top:6px!important}

/* panel entry */
.panel.enter .ph,.panel.enter .chips,.panel.enter .promo,.panel.enter .sec{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.panel.enter .mega span:first-child{animation:slideL .6s var(--ease) both}
.panel.enter .mega span:last-child{animation:slideR .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{transform:translateX(-18px)}to{transform:none}}
@keyframes slideR{from{transform:translateX(18px)}to{transform:none}}
.it.hit .it-n{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--clay) 45%,transparent) 0)}
.empty{padding-block:30px;font:600 17px var(--f-disp);text-align:center}

/* footer */
.foot{padding-block:28px 40px;border-top:2.5px solid var(--ink);display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.foot p{margin:0;font:600 12.5px var(--f-disp);max-width:46ch}
.links{display:flex;gap:20px;flex-wrap:wrap}
.links a{display:flex;align-items:center;gap:7px;text-decoration:none;font:500 15px var(--f-body)}
.links a:hover{text-decoration:underline;text-underline-offset:3px}
.links svg{width:20px;height:20px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

<div class="wrap hero" id="top">
  <span class="logo" role="img" aria-label="Café mosh."><i class="l-cafe"></i><i class="l-mosh"></i><i class="l-dot"></i></span>
  <p class="tag">loveyouso<b>mosh.</b></p>
</div>

<div class="bar" id="bar">
  <div class="wrap bar-in">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Karte"><span class="pill" id="pill" aria-hidden="true"></span>{{TABS}}</nav>
    <label class="find" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
      <input id="q" type="search" placeholder="Suchen, z. B. Matcha" autocomplete="off" aria-label="Menü durchsuchen"></label>
  </div>
</div>

<main class="wrap" id="menu">
{{PANELS}}
<p class="empty" id="empty" hidden>Nichts gefunden. Probier ein anderes Wort.</p>
</main>

<footer class="wrap foot">
  <p>Informationen zu Allergenen &amp; Zusatzstoffen erhalten Sie jederzeit auf Anfrage.</p>
  <div class="links">
    <a href="https://www.instagram.com/cafe.mosh/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>cafe.mosh</a>
    <a href="https://www.cafemosh.de/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>www.cafemosh.de</a>
  </div>
</footer>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const tabs = $$('.tab'), panels = $$('.panel'), pill = $('#pill'), tabsEl = $('#tabs'), bar = $('#bar'), q = $('#q'), empty = $('#empty');
  const hero = $('#top');
  let cur = null, io = null;

  function movePill(t) {
    pill.style.width = t.offsetWidth + 'px';
    pill.style.transform = `translateX(${t.offsetLeft}px)`;
    tabsEl.scrollTo({ left: t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2 });
  }

  function spy(panel) {
    io && io.disconnect();
    const chips = $$('.chip', panel), bar2 = $('.chips', panel);
    const map = new Map(chips.map(c => [c.dataset.s, c]));
    const seen = new Set();
    io = new IntersectionObserver(es => {
      es.forEach(e => e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id));
      const first = $$('.sec', panel).find(s => seen.has(s.id));
      if (!first) return;
      chips.forEach(c => c.classList.toggle('on', c.dataset.s === first.id));
      const c = map.get(first.id);
      bar2.scrollTo({ left: c.offsetLeft - 16 });
    }, { rootMargin: '-130px 0px -55% 0px' });
    $$('.sec', panel).forEach(s => io.observe(s));
  }

  function show(id, scroll) {
    const t = tabs.find(x => x.dataset.p === id) || tabs[0];
    id = t.dataset.p;
    if (cur === id) return;
    cur = id;
    tabs.forEach(x => x.setAttribute('aria-selected', x === t));
    panels.forEach(p => {
      const on = p.dataset.p === id;
      p.hidden = !on;
      p.classList.remove('enter');
      if (on) { void p.offsetWidth; p.classList.add('enter'); }
    });
    movePill(t);
    try { localStorage.setItem('mosh-tab', id); } catch (e) {}
    if (scroll && window.scrollY > hero.offsetHeight) window.scrollTo({ top: hero.offsetHeight, behavior: 'instant' });
  }

  tabs.forEach(t => t.addEventListener('click', ev => {
    ev.preventDefault();
    show(t.dataset.p, true);
    history.replaceState(null, '', '#' + t.dataset.p);
  }));

  // section chips: smooth jump without changing panel
  document.addEventListener('click', ev => {
    const c = ev.target.closest('.chip');
    if (!c) return;
    ev.preventDefault();
    document.getElementById(c.dataset.s).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });

  // search across every panel
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const items = $$('.it').map(li => ({ li, sec: li.closest('.sec'), txt: norm(li.textContent + ' ' + li.closest('.sec').querySelector('.sec-h').textContent) }));
  q.addEventListener('input', () => {
    const v = norm(q.value.trim());
    bar.classList.toggle('searching', !!v);
    if (!v) {
      items.forEach(o => { o.li.hidden = false; o.li.classList.remove('hit'); });
      $$('.sec').forEach(s => s.hidden = false);
      empty.hidden = true;
      const id = cur; cur = null; show(id);
      return;
    }
    io && io.disconnect();
    const words = v.split(/\s+/);
    let n = 0;
    items.forEach(o => { const m = words.every(w => o.txt.includes(w)); o.li.hidden = !m; o.li.classList.toggle('hit', m); n += m; });
    $$('.sec').forEach(s => s.hidden = !$$('.it', s).some(li => !li.hidden));
    panels.forEach(p => { p.hidden = !$$('.sec', p).some(s => !s.hidden); p.classList.remove('enter'); });
    empty.hidden = n > 0;
  });
  q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); } });

  let start = location.hash.slice(1);
  if (!tabs.some(t => t.dataset.p === start)) { try { start = localStorage.getItem('mosh-tab'); } catch (e) {} }
  show(start || tabs[0].dataset.p);
  addEventListener('resize', () => movePill(tabs.find(t => t.dataset.p === cur)), { passive: true });
  document.fonts && document.fonts.ready.then(() => movePill(tabs.find(t => t.dataset.p === cur)));
})();
</script>
